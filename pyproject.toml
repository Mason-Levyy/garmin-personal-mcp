[project]
name = "garmin-personal-mcp"
version = "0.1.0"
description = "Read-only MCP server for your own Garmin Connect data via Garmin's official Personal API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Mason Levy" }]
dependencies = [
    "mcp>=1.10,<2",
    "garmin-connect-personal-api-python>=1,<2",
]

[project.scripts]
garmin-personal-mcp = "garmin_personal_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_personal_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
