name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --only-group dev ruff check --output-format github .
      - run: uv run --only-group dev ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run pytest

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          python3 -c "
          import json, tomllib
          pyproject_version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          server = json.load(open('server.json'))
          plugin = json.load(open('plugin/.claude-plugin/plugin.json'))
          plugin_args = json.load(open('plugin/.mcp.json'))['mcpServers']['garmin']['args']
          pinned = plugin_args[0].split('==')[1]
          found = {
              'pyproject.toml': pyproject_version,
              'server.json version': server['version'],
              'server.json packages[0].version': server['packages'][0]['version'],
              'plugin/.claude-plugin/plugin.json': plugin['version'],
              'plugin/.mcp.json pin': pinned,
          }
          assert len(set(found.values())) == 1, f'version mismatch: {found}'
          "
